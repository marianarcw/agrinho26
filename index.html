<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Sustentabilidade Agrícola</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Agro Forte 🌱</h1>
        <p>Calcule o índice de sustentabilidade da sua produção agrícola.</p>

        <form id="formulario">
            <label for="agua">Consumo de água (litros/ha):</label>
            <input type="number" id="agua" required>

            <label for="fertilizantes">Fertilizantes (kg/ha):</label>
            <input type="number" id="fertilizantes" required>

            <label for="defensivos">Defensivos (kg/ha):</label>
            <input type="number" id="defensivos" required>

            <button type="submit">Calcular Sustentabilidade</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
