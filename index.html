<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agro Forte - Futuro Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Agro Forte - Futuro Sustentável</h1>
        <p>Equilibre produção agrícola e meio ambiente.</p>

        <form id="formSustentavel">
            <label>Consumo de água (litros/ha):</label>
            <input type="number" id="agua" required>

            <label>Fertilizantes (kg/ha):</label>
            <input type="number" id="fertilizantes" required>

            <label>Defensivos (kg/ha):</label>
            <input type="number" id="defensivos" required>

            <button type="submit">Calcular Sustentabilidade</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
